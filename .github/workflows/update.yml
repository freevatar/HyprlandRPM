name: Update revisions

on:
  workflow_dispatch:
  schedule:
    - cron: '45 */6 * * *'

concurrency:
  group: hyprland-rpm-builds
  cancel-in-progress: false

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: registry.fedoraproject.org/fedora-minimal:44
    defaults:
      run:
        shell: bash

    steps:
      - name: Prepare
        run: |
          dnf -y install --nodocs --setopt=install_weak_deps=0 \
            git-core rpm-build rpmdevtools python3 python3-rpm \
            redhat-rpm-config cmake-rpm-macros meson \
            python-rpm-macros python3-rpm-macros systemd-rpm-macros \
            cmake gcc-c++ patch pkgconf-pkg-config

      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Update, validate, and publish specs
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          bash .github/scripts/update.sh

      - name: Use the validated commit
        env:
          SOURCE_COMMIT: ${{ steps.update.outputs.commit }}
        run: git checkout --detach "$SOURCE_COMMIT"

      - name: Build or resume COPR packages
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          COPR_OWNER: ${{ vars.COPR_OWNER || 'giperborey' }}
          COPR_PROJECT: ${{ vars.COPR_PROJECT || 'Hyprland' }}
          SOURCE_COMMIT: ${{ steps.update.outputs.commit }}
        run: |
          python3 -B scripts/rebuild.py build \
            --owner "$COPR_OWNER" --project "$COPR_PROJECT" \
            --repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --commit "$SOURCE_COMMIT"
