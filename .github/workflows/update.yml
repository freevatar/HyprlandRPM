name: Update revisions

on:
  workflow_dispatch:
  schedule:
    - cron: '45 */6 * * *'

concurrency:
  group: hyprland-rpm-updates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: registry.fedoraproject.org/fedora-minimal:44
    defaults:
      run:
        shell: bash
    outputs:
      commit: ${{ steps.update.outputs.commit }}

    steps:
      - name: Prepare
        run: |
          dnf -y install --nodocs --setopt=install_weak_deps=0 \
            git-core rpm-build rpmdevtools python3 python3-rpm \
            redhat-rpm-config cmake-rpm-macros meson \
            python-rpm-macros python3-rpm-macros systemd-rpm-macros

      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Prepare and publish revisions
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          bash .github/scripts/update.sh

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      source_commit: ${{ needs.prepare.outputs.commit }}
    secrets:
      COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
      COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
