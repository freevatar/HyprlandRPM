name: Build RPMs

on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
    secrets:
      COPR_LOGIN:
        required: true
      COPR_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  check:
    name: Validate Fedora ${{ matrix.fedora }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: [44, 45]
    container:
      image: registry.fedoraproject.org/fedora-minimal:${{ matrix.fedora }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Install validation tools
        run: |
          dnf -y install --nodocs --setopt=install_weak_deps=0 \
            git-core rpm-build rpmdevtools python3 python3-rpm \
            redhat-rpm-config cmake-rpm-macros meson \
            python-rpm-macros python3-rpm-macros systemd-rpm-macros \
            cmake gcc-c++ patch pkgconf-pkg-config

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Validate packages
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check.sh "$BASE_REF"

  build:
    name: Build in COPR
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: hyprland-rpm-builds
      cancel-in-progress: false
    container:
      image: registry.fedoraproject.org/fedora-minimal:44
    defaults:
      run:
        shell: bash

    steps:
      - name: Install build planning tools
        run: |
          dnf -y install --nodocs --setopt=install_weak_deps=0 \
            git-core rpm-build rpmdevtools python3 python3-rpm \
            redhat-rpm-config cmake-rpm-macros meson \
            python-rpm-macros python3-rpm-macros systemd-rpm-macros

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build or resume COPR packages
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          COPR_OWNER: ${{ vars.COPR_OWNER || 'giperborey' }}
          COPR_PROJECT: ${{ vars.COPR_PROJECT || 'Hyprland' }}
        run: |
          python3 -B scripts/rebuild.py build \
            --owner "$COPR_OWNER" --project "$COPR_PROJECT" \
            --repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --commit "$(git rev-parse HEAD)"
