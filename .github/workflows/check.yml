name: Check packaging tooling

on:
  push:
    branches: ['**']
    paths:
      - '**/*.spec'
      - '**/*.patch'
      - '**/*.diff'
      - '**/macros.*'
      - 'scripts/**'
      - 'build-plan.json'
      - 'package-graph.json'
      - 'hyprland-git/update.py'
      - 'tests/**'
      - '.copr/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**/*.spec'
      - '**/*.patch'
      - '**/*.diff'
      - '**/macros.*'
      - 'scripts/**'
      - 'build-plan.json'
      - 'package-graph.json'
      - 'hyprland-git/update.py'
      - 'tests/**'
      - '.copr/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora-minimal:44
    defaults:
      run:
        shell: bash

    steps:
      - name: Install validation tools
        run: |
          dnf -y install --nodocs --setopt=install_weak_deps=0 \
            git-core rpm-build rpmdevtools python3 python3-rpm redhat-rpm-config \
            cmake-rpm-macros meson \
            python-rpm-macros python3-rpm-macros systemd-rpm-macros \
            cmake gcc-c++ patch pkgconf-pkg-config

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Validate packaging tooling
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_REF" =~ ^0+$ ]]; then
            BASE_REF=$(git merge-base HEAD origin/master)
          fi
          bash scripts/check.sh "$BASE_REF"
